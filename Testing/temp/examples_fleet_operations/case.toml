version = 1
name = "Examples: Fleet Operations renders"
description = "Validates the fleet example generates valid PUML and renders all generated diagrams with PlantUML."
args = []
input = "../../../examples/fleet-operations"
timeout_seconds = 30
render_all_puml = true
tags = ["examples", "plantuml", "render"]

[metadata]
id = "examples_fleet_operations"
owner = "core"
priority = "high"

[[outputs]]
file = "generated/design/FleetOperations.design.puml"
contains = ["class Driver <<actor>> {"]
not_contains = ["actor Driver <<actor>> {"]

[[outputs]]
file = "generated/ssd/FleetOperations_DispatchTrip.ssd.puml"
contains = [
	"title System Sequence Diagram: DispatchTrip",
	"Actor -> System : Review dispatch request",
	"System -> Actor : Confirm dispatch release(routeCode)"
]
not_contains = [
	"participant \"DispatchPlanner\" as DispatchPlanner",
	"participant \"CrewService\" as CrewService",
	"participant \"TelematicsPlatform\" as TelematicsPlatform",
	"participant \"DriverApp\" as DriverApp"
]

[[outputs]]
file = "generated/ssd/FleetOperations_OpenMaintenanceCase.ssd.puml"
contains = [
	"title System Sequence Diagram: OpenMaintenanceCase",
	"actor \"Telemetry service\" as Actor",
	"Actor -> System : Classify alert(source, severity)",
	"System -> Actor : Acknowledge maintenance case(workOrderNumber)"
]
not_contains = [
	"participant \"MaintenancePlanner\" as MaintenancePlanner",
	"participant \"DepotCoordinator\" as DepotCoordinator"
]

[[outputs]]
file = "generated/sequence/FleetOperations_DispatchTrip.sequence.puml"
contains = [
	"title Sequence Diagram: DispatchTrip",
	"participant \"DispatchPlanner\" as DispatchPlanner",
	"participant \"CrewService\" as CrewService",
	"participant \"TelematicsPlatform\" as TelematicsPlatform",
	"participant \"DriverApp\" as DriverApp",
	"note over Actor : Review dispatch request",
	"Actor -> DispatchPlanner : Assign vehicle(routeCode, vehicleClass)",
	"DispatchPlanner -> CrewService : Assign driver(driverCode)",
	"CrewService -> TelematicsPlatform : Release vehicle(vin)",
	"TelematicsPlatform -> DriverApp : Notify driver(routeCode)",
	"DriverApp -> Actor : Confirm dispatch release(routeCode)"
]
not_contains = [
	"participant \"system\" as System",
	"System ->"
]

[[outputs]]
file = "generated/sequence/FleetOperations_OpenMaintenanceCase.sequence.puml"
contains = [
	"title Sequence Diagram: OpenMaintenanceCase",
	"participant \"MaintenancePlanner\" as MaintenancePlanner",
	"participant \"DepotCoordinator\" as DepotCoordinator",
	"actor \"Telemetry service\" as Actor",
	"note over Actor : Classify alert(source, severity)",
	"Actor -> MaintenancePlanner : Create work order(vin, workOrderNumber)",
	"MaintenancePlanner -> DepotCoordinator : Notify depot coordinator(workOrderNumber)",
	"DepotCoordinator -> Actor : Acknowledge maintenance case(workOrderNumber)"
]
not_contains = [
	"participant \"system\" as System",
	"System ->"
]

[[outputs]]
file = "generated/design/FleetOperations.design.svg"

[[outputs]]
file = "generated/activity/FleetOperations.activity.svg"

[[outputs]]
file = "generated/domain/FleetOperations.domain.svg"

[[outputs]]
file = "generated/sequence/FleetOperations_DispatchTrip.sequence.svg"

[[outputs]]
file = "generated/sql/fleet_operations.sql"

[[outputs]]
file = "generated/docs/fleet_operations.md"
