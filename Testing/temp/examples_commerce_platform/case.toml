version = 1
name = "Examples: Commerce Platform renders"
description = "Validates the commerce example generates valid PUML and renders all generated diagrams with PlantUML."
args = []
input = "../../../examples/commerce-platform"
timeout_seconds = 30
render_all_puml = true
tags = ["examples", "plantuml", "render"]

[metadata]
id = "examples_commerce_platform"
owner = "core"
priority = "high"

[[outputs]]
file = "generated/design/CommercePlatform.design.puml"
contains = ["class OperationsAdmin <<actor>> {"]
not_contains = ["actor OperationsAdmin <<actor>> {"]

[[outputs]]
file = "generated/activity/CommercePlatform.activity.puml"
contains = ["if (Payment already authorized) then (yes)", "else (no)", ":Authorize payment;"]
not_contains = ["goto Checkout_inventoryReservation"]

[[outputs]]
file = "generated/ssd/CommercePlatform_Checkout.ssd.puml"
contains = [
	"Actor -> System : Review cart",
	"Actor -> System : Submit order(cartToken, shippingAddressId)",
	"System -> Actor : Send order confirmation(orderNumber)",
	"opt unless Payment already authorized"
]
not_contains = [
	"Actor -> System : Authorize payment(orderNumber, totalAmount)",
	"Actor -> System : Confirm payment authorization(providerReference)",
	"Actor -> System : Reserve inventory(orderNumber)",
	"Actor -> System : Create shipment(warehouseCode)",
	"Actor -> System : Confirm shipment plan(shipmentReference)",
	"System -> System : Authorize payment(orderNumber, totalAmount)",
	"participant \"PaymentGateway\" as PaymentGateway",
	"participant \"InventoryService\" as InventoryService",
	"participant \"FulfillmentService\" as FulfillmentService"
]

[[outputs]]
file = "generated/ssd/CommercePlatform_HandleReturn.ssd.puml"
contains = [
	"title System Sequence Diagram: HandleReturn",
	"actor \"Support agent\" as Actor",
	"Actor -> System : Validate return window",
	"Actor -> System : Approve return(orderNumber, reasonCode)",
	"System -> Actor : Send return confirmation(orderNumber)"
]
not_contains = [
	"Actor -> System : Issue refund(providerReference)",
	"Actor -> System : Confirm refund(providerReference)",
	"participant \"PaymentGateway\" as PaymentGateway"
]

[[outputs]]
file = "generated/sequence/CommercePlatform_Checkout.sequence.puml"
contains = [
	"title Sequence Diagram: Checkout",
	"participant \"CheckoutApplication\" as CheckoutApplication",
	"participant \"PaymentGateway\" as PaymentGateway",
	"participant \"InventoryService\" as InventoryService",
	"participant \"FulfillmentService\" as FulfillmentService",
	"note over Actor : Review cart",
	"Actor -> CheckoutApplication : Submit order(cartToken, shippingAddressId)",
	"opt unless Payment already authorized",
	"CheckoutApplication -> PaymentGateway : Authorize payment(orderNumber, totalAmount)",
	"PaymentGateway -> CheckoutApplication : Confirm payment authorization(providerReference)",
	"CheckoutApplication -> InventoryService : Reserve inventory(orderNumber)",
	"InventoryService -> FulfillmentService : Create shipment(warehouseCode)",
	"FulfillmentService -> CheckoutApplication : Confirm shipment plan(shipmentReference)",
	"CheckoutApplication -> Actor : Send order confirmation(orderNumber)"
]
not_contains = [
	"participant \"system\" as System",
	"System ->",
	"alt Fraud review required",
	"note over Actor : Submit order"
]

[[outputs]]
file = "generated/sequence/CommercePlatform_HandleReturn.sequence.puml"
contains = [
	"title Sequence Diagram: HandleReturn",
	"participant \"ReturnsApplication\" as ReturnsApplication",
	"participant \"PaymentGateway\" as PaymentGateway",
	"actor \"Support agent\" as Actor",
	"note over Actor : Validate return window",
	"Actor -> ReturnsApplication : Approve return(orderNumber, reasonCode)",
	"ReturnsApplication -> PaymentGateway : Issue refund(providerReference)",
	"PaymentGateway -> ReturnsApplication : Confirm refund(providerReference)",
	"ReturnsApplication -> Actor : Send return confirmation(orderNumber)"
]
not_contains = [
	"participant \"system\" as System",
	"System ->",
	"note over Actor : Approve return"
]

[[outputs]]
file = "generated/state/CommercePlatform_Order.state.puml"
contains = [
	"state Draft",
	"state Submitted",
	"state Paid",
	"state Shipped",
	"state Delivered",
	"state Returned",
	"[*] --> Draft",
	"Draft --> Submitted : Submit (PlaceOrder)",
	"Submitted --> Paid : MarkPaid (CapturePayment)",
	"Draft --> Paid : Checkout",
	"Delivered --> Returned : HandleReturn"
]
not_contains = [
	"state status",
	"state Not_status",
	"status --> status"
]

[[outputs]]
file = "generated/state/CommercePlatform_PaymentAuthorization.state.puml"
contains = [
	"state Requested",
	"state Authorized",
	"state Captured",
	"[*] --> Requested"
]
not_contains = [
	"state paymentState",
	"state Not_paymentState"
]

[[outputs]]
file = "generated/state/CommercePlatform_Shipment.state.puml"
contains = [
	"state Picking",
	"state Packed",
	"state InTransit",
	"state Delivered",
	"[*] --> Picking"
]
not_contains = [
	"state fulfillmentState",
	"state Not_fulfillmentState"
]

[[outputs]]
file = "generated/state/CommercePlatform_ShoppingCart.state.puml"
contains = [
	"state Open",
	"state Frozen",
	"[*] --> Open",
	"Open --> Frozen : Freeze (StartFraudReview)",
	"Frozen --> Open : Reopen (ClearFraudReview)"
]
not_contains = [
	"state Draft",
	"state Paid",
	"state Delivered",
	"state Returned",
	"Draft --> Paid : Checkout",
	"Delivered --> Returned : HandleReturn"
]

[[outputs]]
file = "generated/design/CommercePlatform.design.svg"

[[outputs]]
file = "generated/activity/CommercePlatform.activity.svg"

[[outputs]]
file = "generated/domain/CommercePlatform.domain.svg"

[[outputs]]
file = "generated/sequence/CommercePlatform_Checkout.sequence.svg"

[[outputs]]
file = "generated/sql/commerce_platform.sql"

[[outputs]]
file = "generated/docs/commerce_platform.md"
